<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Sholat Quest</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#10142a">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --bg: #10142a;
    --bg2: #171d3d;
    --line: #2a3163;
    --ink: #eef0fb;
    --muted: #8d94bf;
    --amber: #f0a857;
    --teal: #5fc9a8;
    --rose-danger: #d1697a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    padding-bottom: 40px;
  }
  #app { max-width: 460px; margin: 0 auto; padding: 18px 16px; }

  .day-strip {
    height: 5px;
    border-radius: 3px;
    margin-bottom: 20px;
    background: linear-gradient(90deg, #e8919c, #f0d878 28%, #f0a857 52%, #e8735a 74%, #3a3f72 100%);
  }

  .header h1 {
    font-size: 23px;
    font-weight: 700;
    letter-spacing: -0.2px;
    margin-bottom: 3px;
  }
  .header .sub {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 16px;
  }
  .level-row {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .level-row strong { color: var(--ink); font-weight: 700; }
  .xp-track {
    background: var(--bg2);
    border: 1px solid var(--line);
    border-radius: 8px;
    height: 8px;
    overflow: hidden;
  }
  .xp-fill {
    background: linear-gradient(90deg, var(--amber), #d1893f);
    height: 100%;
    border-radius: 8px;
    transition: width .4s ease;
  }
  .xp-caption { font-size: 11px; color: var(--muted); margin-top: 6px; margin-bottom: 20px; }

  .tabs {
    display: flex;
    background: var(--bg2);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 18px;
  }
  .tab-btn {
    flex: 1;
    text-align: center;
    padding: 9px 4px;
    border-radius: 9px;
    font-size: 13px;
    color: var(--muted);
    cursor: pointer;
    border: none;
    background: none;
    font-family: inherit;
    font-weight: 600;
  }
  .tab-btn.active { background: var(--line); color: var(--amber); }

  .section { margin-bottom: 22px; }
  .section h2 {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 10px;
    color: var(--ink);
  }
  .prayer-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 11px 2px;
    border-bottom: 1px solid var(--line);
  }
  .prayer-row:last-child { border-bottom: none; }
  .prayer-left { display: flex; align-items: center; gap: 10px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .prayer-name { font-size: 15px; }
  .prayer-right { display: flex; align-items: center; gap: 10px; }
  .xp-tag { font-size: 11px; color: var(--muted); }
  .check-btn {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 1.5px solid var(--line);
    background: transparent;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: transparent;
    font-size: 14px;
    transition: .2s;
  }
  .check-btn.done {
    background: var(--teal);
    border-color: var(--teal);
    color: #0d2a22;
  }

  .full-day-banner {
    background: var(--bg2);
    border: 1px solid var(--teal);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 18px;
    font-size: 14px;
    color: var(--teal);
    font-weight: 600;
  }

  .history-summary {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 18px;
  }
  .history-summary .box {
    background: var(--bg2);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px;
  }
  .history-summary .box .num { font-size: 20px; font-weight: 700; color: var(--amber); }
  .history-summary .box .lbl { font-size: 11px; color: var(--muted); margin-top: 2px; }

  .day-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 2px;
    border-bottom: 1px solid var(--line);
  }
  .day-item:last-child { border-bottom: none; }
  .day-item .date { font-size: 13px; font-weight: 600; }
  .day-item .date .yr { color: var(--muted); font-size: 11px; font-weight: 400; }
  .day-item .dots { display: flex; gap: 5px; }
  .day-item .dot-h { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
  .day-item .sunnah-count { font-size: 11px; color: var(--amber); margin-left: 10px; white-space: nowrap; }

  .badge-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .badge-card {
    background: var(--bg2);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px 10px;
    text-align: center;
  }
  .badge-card.locked { opacity: 0.4; }
  .badge-card .icon { font-size: 26px; margin-bottom: 6px; }
  .badge-card .lbl { font-size: 12px; font-weight: 700; margin-bottom: 2px; }
  .badge-card .desc { font-size: 10px; color: var(--muted); }

  .empty-msg { text-align: center; color: var(--muted); font-size: 13px; padding: 24px 0; }

  .footer-actions { text-align: center; margin-top: 16px; }
  .reset-link {
    font-size: 12px;
    color: var(--muted);
    background: none;
    border: none;
    text-decoration: underline;
    cursor: pointer;
    font-family: inherit;
  }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(6, 8, 20, 0.7);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 50;
  }
  .modal-box {
    background: var(--bg2);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 20px;
    max-width: 300px;
    text-align: center;
  }
  .modal-box p { font-size: 14px; margin-bottom: 16px; color: var(--ink); }
  .modal-actions { display: flex; gap: 10px; }
  .modal-actions button {
    flex: 1;
    padding: 10px;
    border-radius: 9px;
    border: none;
    font-family: inherit;
    font-weight: 600;
    cursor: pointer;
    font-size: 13px;
  }
  .btn-cancel { background: var(--line); color: var(--ink); }
  .btn-danger { background: var(--rose-danger); color: #fff; }

  .loading { text-align: center; padding: 60px 0; color: var(--muted); }
</style>
</head>
<body>
<div id="app">
  <div class="loading">Memuat...</div>
</div>

<script>
const WAJIB = [
  { id:'subuh', label:'Subuh', xp:10, color:'#e8919c' },
  { id:'dzuhur', label:'Dzuhur', xp:10, color:'#f0d878' },
  { id:'ashar', label:'Ashar', xp:10, color:'#f0a857' },
  { id:'maghrib', label:'Maghrib', xp:10, color:'#e8735a' },
  { id:'isya', label:'Isya', xp:10, color:'#7c85c9' },
];

const SUNNAH = [
  { id:'qabliyahSubuh', label:'Qabliyah Subuh', xp:5, color:'#e8919c' },
  { id:'dhuha', label:'Dhuha', xp:5, color:'#f0c05a' },
  { id:'qabliyahDzuhur', label:'Qabliyah Dzuhur', xp:5, color:'#f0d878' },
  { id:'badiyahDzuhur', label:"Ba'diyah Dzuhur", xp:5, color:'#f0d878' },
  { id:'badiyahMaghrib', label:"Ba'diyah Maghrib", xp:5, color:'#e8735a' },
  { id:'badiyahIsya', label:"Ba'diyah Isya", xp:5, color:'#7c85c9' },
  { id:'tahajud', label:'Tahajud', xp:8, color:'#7c85c9' },
  { id:'witr', label:'Witr', xp:5, color:'#7c85c9' },
  { id:'hajat', label:'Hajat', xp:5, color:'#a78bc4' },
  { id:'taubat', label:'Taubat', xp:5, color:'#c47ba0' },
];

const STORAGE_KEY = 'sholat-quest-data';
const LEVEL_XP = 150;

let state = { logs: {} };
let activeTab = 'today';
let pendingReset = false;

const hasClaudeStorage = typeof window.storage !== 'undefined';
let hasLocalStorage = false;
try {
  localStorage.setItem('__sq_test__', '1');
  localStorage.removeItem('__sq_test__');
  hasLocalStorage = true;
} catch (e) {
  hasLocalStorage = false;
}

function pad(n){ return String(n).padStart(2,'0'); }
function formatDate(d){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function todayStr(){ return formatDate(new Date()); }
function addDays(dateStr, delta){
  const d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() + delta);
  return formatDate(d);
}
function dayLabel(dateStr){
  const d = new Date(dateStr + 'T00:00:00');
  const bulan = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Ags','Sep','Okt','Nov','Des'];
  return { dm: `${d.getDate()} ${bulan[d.getMonth()]}`, y: d.getFullYear() };
}

function peekDay(dateStr){
  const day = state.logs[dateStr];
  if (!day) return { wajib: {}, sunnah: {} };
  return { wajib: day.wajib || {}, sunnah: day.sunnah || {} };
}
function getDay(dateStr){
  if (!state.logs[dateStr]) state.logs[dateStr] = { wajib: {}, sunnah: {} };
  if (!state.logs[dateStr].wajib) state.logs[dateStr].wajib = {};
  if (!state.logs[dateStr].sunnah) state.logs[dateStr].sunnah = {};
  return state.logs[dateStr];
}

function isFullWajib(day){ return WAJIB.every(w => day.wajib && day.wajib[w.id]); }
function isFullSunnah(day){ return SUNNAH.every(s => day.sunnah && day.sunnah[s.id]); }

function computeStats(){
  let totalWajib=0, totalSunnah=0, fullDays=0, sunnahFullDays=0, xp=0;
  const sunnahCounts = {}; SUNNAH.forEach(s => sunnahCounts[s.id] = 0);
  const dates = Object.keys(state.logs);

  dates.forEach(ds => {
    const day = state.logs[ds];
    WAJIB.forEach(w => { if (day.wajib && day.wajib[w.id]) { totalWajib++; xp += w.xp; } });
    SUNNAH.forEach(s => { if (day.sunnah && day.sunnah[s.id]) { totalSunnah++; xp += s.xp; sunnahCounts[s.id]++; } });
    if (isFullWajib(day)) { fullDays++; xp += 20; }
    if (isFullSunnah(day)) sunnahFullDays++;
  });

  const level = Math.floor(xp / LEVEL_XP) + 1;
  const xpIntoLevel = xp % LEVEL_XP;

  const sorted = dates.slice().sort();
  let best = 0, current = 0, prev = null;
  sorted.forEach(ds => {
    const day = state.logs[ds];
    if (isFullWajib(day)) {
      current = (prev && addDays(prev,1) === ds) ? current + 1 : 1;
      best = Math.max(best, current);
    } else {
      current = 0;
    }
    prev = ds;
  });

  let streak = 0;
  let cursor = todayStr();
  const todayDay = state.logs[cursor];
  if (!todayDay || !isFullWajib(todayDay)) cursor = addDays(cursor, -1);
  while (state.logs[cursor] && isFullWajib(state.logs[cursor])) {
    streak++;
    cursor = addDays(cursor, -1);
  }

  return { totalWajib, totalSunnah, fullDays, sunnahFullDays, sunnahCounts, xp, level, xpIntoLevel, bestStreak: best, streak, daysTracked: dates.length };
}

function getBadgeDefs(stats){
  return [
    { icon:'🌱', label:'Langkah Awal', desc:'Catat 1 sholat', ok: stats.totalWajib + stats.totalSunnah >= 1 },
    { icon:'✅', label:'Sholat Lengkap', desc:'5 waktu dalam sehari', ok: stats.fullDays >= 1 },
    { icon:'🔥', label:'Konsisten 3 Hari', desc:'Streak 3 hari', ok: stats.bestStreak >= 3 },
    { icon:'🔥', label:'Konsisten 7 Hari', desc:'Streak 7 hari', ok: stats.bestStreak >= 7 },
    { icon:'🏆', label:'Konsisten 30 Hari', desc:'Streak 30 hari', ok: stats.bestStreak >= 30 },
    { icon:'☀️', label:'Ahli Dhuha', desc:'Dhuha 10 kali', ok: stats.sunnahCounts.dhuha >= 10 },
    { icon:'🌙', label:'Pejuang Malam', desc:'Tahajud 10 kali', ok: stats.sunnahCounts.tahajud >= 10 },
    { icon:'💎', label:'Kolektor Sunnah', desc:'Semua sunnah sehari', ok: stats.sunnahFullDays >= 1 },
    { icon:'⭐', label:'Level 5', desc:'Capai level 5', ok: stats.level >= 5 },
    { icon:'🌟', label:'Level 10', desc:'Capai level 10', ok: stats.level >= 10 },
  ];
}

async function loadData(){
  try {
    if (hasClaudeStorage) {
      const result = await window.storage.get(STORAGE_KEY);
      if (result && result.value) {
        const parsed = JSON.parse(result.value);
        if (parsed && parsed.logs) state = parsed;
      }
    } else if (hasLocalStorage) {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (parsed && parsed.logs) state = parsed;
      }
    }
  } catch (e) {
    state = { logs: {} };
  }
  render();
}

async function saveData(){
  try {
    if (hasClaudeStorage) {
      await window.storage.set(STORAGE_KEY, JSON.stringify(state));
    } else if (hasLocalStorage) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }
  } catch (e) {
    console.error('Gagal menyimpan data', e);
  }
}

function toggle(type, id){
  const day = getDay(todayStr());
  day[type][id] = !day[type][id];
  saveData();
  render();
}
function setTab(t){ activeTab = t; render(); }
function requestReset(){ pendingReset = true; render(); }
function cancelReset(){ pendingReset = false; render(); }
function confirmReset(){
  state = { logs: {} };
  pendingReset = false;
  saveData();
  render();
}

function renderToday(){
  const day = peekDay(todayStr());
  const full = isFullWajib(day);
  let html = '';
  if (full) html += `<div class="full-day-banner">Alhamdulillah, 5 waktu hari ini lengkap.</div>`;

  html += `<div class="section"><h2>Sholat wajib</h2>`;
  WAJIB.forEach(w => {
    const done = !!day.wajib[w.id];
    html += `<div class="prayer-row">
      <span class="prayer-left"><span class="dot" style="background:${w.color}"></span><span class="prayer-name">${w.label}</span></span>
      <span class="prayer-right"><span class="xp-tag">+${w.xp}</span>
        <button class="check-btn ${done ? 'done' : ''}" onclick="toggle('wajib','${w.id}')">${done ? '✓' : ''}</button>
      </span></div>`;
  });
  html += `</div>`;

  html += `<div class="section"><h2>Sholat sunnah</h2>`;
  SUNNAH.forEach(s => {
    const done = !!day.sunnah[s.id];
    html += `<div class="prayer-row">
      <span class="prayer-left"><span class="dot" style="background:${s.color}"></span><span class="prayer-name">${s.label}</span></span>
      <span class="prayer-right"><span class="xp-tag">+${s.xp}</span>
        <button class="check-btn ${done ? 'done' : ''}" onclick="toggle('sunnah','${s.id}')">${done ? '✓' : ''}</button>
      </span></div>`;
  });
  html += `</div>`;
  return html;
}

function renderHistory(stats){
  let html = `<div class="history-summary">
    <div class="box"><div class="num">${stats.daysTracked}</div><div class="lbl">Hari tercatat</div></div>
    <div class="box"><div class="num">${stats.bestStreak}</div><div class="lbl">Streak terbaik</div></div>
    <div class="box"><div class="num">${stats.totalWajib}</div><div class="lbl">Total sholat wajib</div></div>
    <div class="box"><div class="num">${stats.totalSunnah}</div><div class="lbl">Total sholat sunnah</div></div>
  </div>`;

  const dates = Object.keys(state.logs).sort().reverse().slice(0, 30);
  if (dates.length === 0) {
    html += `<div class="empty-msg">Belum ada riwayat. Mulai catat sholatmu hari ini.</div>`;
  } else {
    html += `<div class="section">`;
    dates.forEach(ds => {
      const day = state.logs[ds];
      const lbl = dayLabel(ds);
      const sunnahCount = SUNNAH.filter(s => day.sunnah && day.sunnah[s.id]).length;
      let dots = '';
      WAJIB.forEach(w => {
        const on = day.wajib && day.wajib[w.id];
        dots += `<span class="dot-h" style="background:${on ? w.color : 'var(--line)'}"></span>`;
      });
      html += `<div class="day-item">
        <span class="date">${lbl.dm} <span class="yr">${lbl.y}</span></span>
        <span style="display:flex;align-items:center;">
          <span class="dots">${dots}</span>
          <span class="sunnah-count">+${sunnahCount} sunnah</span>
        </span></div>`;
    });
    html += `</div>`;
  }
  return html;
}

function renderBadges(stats){
  const badges = getBadgeDefs(stats);
  let html = `<div class="badge-grid">`;
  badges.forEach(b => {
    html += `<div class="badge-card ${b.ok ? '' : 'locked'}">
      <div class="icon">${b.ok ? b.icon : '🔒'}</div>
      <div class="lbl">${b.label}</div>
      <div class="desc">${b.desc}</div>
    </div>`;
  });
  html += `</div>`;
  return html;
}

function render(){
  const stats = computeStats();
  const pct = Math.round((stats.xpIntoLevel / LEVEL_XP) * 100);

  let body = `<div class="day-strip"></div>
    <div class="header">
      <h1>Sholat Quest</h1>
      <div class="sub">Pencatat sholat 5 waktu &amp; sunnah</div>
      <div class="level-row"><span>Level <strong>${stats.level}</strong></span><span>${stats.streak} hari beruntun</span></div>
      <div class="xp-track"><div class="xp-fill" style="width:${pct}%"></div></div>
      <div class="xp-caption">${stats.xpIntoLevel} / ${LEVEL_XP} XP ke level berikutnya</div>
    </div>
    <div class="tabs">
      <button class="tab-btn ${activeTab==='today'?'active':''}" onclick="setTab('today')">Hari ini</button>
      <button class="tab-btn ${activeTab==='history'?'active':''}" onclick="setTab('history')">Riwayat</button>
      <button class="tab-btn ${activeTab==='badges'?'active':''}" onclick="setTab('badges')">Pencapaian</button>
    </div>`;

  if (activeTab === 'today') body += renderToday();
  else if (activeTab === 'history') body += renderHistory(stats);
  else body += renderBadges(stats);

  body += `<div class="footer-actions"><button class="reset-link" onclick="requestReset()">Reset semua data</button></div>`;

  if (pendingReset) {
    body += `<div class="modal-overlay"><div class="modal-box">
      <p>Hapus semua data sholat yang tercatat? Tindakan ini tidak bisa dibatalkan.</p>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="cancelReset()">Batal</button>
        <button class="btn-danger" onclick="confirmReset()">Hapus</button>
      </div></div></div>`;
  }

  document.getElementById('app').innerHTML = body;
}

loadData();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
